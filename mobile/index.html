<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Сайт в разработке — FeedSystems</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../favicon.ico?v=2" sizes="32x32">
  <link rel="icon" href="../favicon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png?v=2">
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b0b; overflow: hidden; }
    iframe {
      display: block;
      width: 100%;
      max-width: 390px;
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      border: 0;
      background: #121212;
    }
  </style>
</head>
<body>
  <iframe id="screen" src="../index.html" title="Сайт в разработке — FeedSystems"></iframe>
  <script>
    // Внешние сайты обычно запрещают открывать себя внутри iframe,
    // поэтому ссылки на них открываем на всё окно.
    const f = document.getElementById('screen');
    f.addEventListener('load', () => {
      f.contentDocument.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_top'; });
    });
  </script>
</body>
</html>
