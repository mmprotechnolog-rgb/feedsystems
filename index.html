<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Сайт в разработке — FeedSystems</title>
  <meta name="description" content="Сайт FeedSystems временно недоступен и находится в разработке. Информацию об оборудовании, поставках и сервисном обслуживании можно получить у специалистов «ПроТехнологии» по телефону 8 (800) 775-75-68.">

  <!-- ЗАГЛУШКА: удалите эту строку после запуска полноценного сайта, чтобы разрешить индексацию -->
  <meta name="robots" content="noindex, follow">

  <link rel="canonical" href="https://feedsystems.ru/">
  <meta name="theme-color" content="#121212">
  <meta name="format-detection" content="telephone=no">

  <link rel="icon" href="favicon.ico?v=2" sizes="32x32">
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">

  <link rel="preload" href="fonts/manrope-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <picture>
      <source media="(max-width: 767px) and (orientation: portrait)" srcset="assets/background-mobile.webp">
      <source media="(max-width: 1440px)" srcset="assets/background-1280.webp 1280w, assets/background.webp 1920w" sizes="100vw">
      <img class="bg__img" src="assets/background.webp" alt="" width="1920" height="1080" fetchpriority="high">
    </picture>
  </div>

  <div class="page">
    <header class="header">
      <img class="logo" src="assets/logo.svg" alt="ПроТехнологии" width="212" height="31">
    </header>

    <main class="hero">
      <h1 class="hero__title">Сайт находится <br class="br-wide">в&nbsp;разработке</h1>
      <p class="hero__text">Пока сайт недоступен, получить информацию <br class="br-wide">об&nbsp;оборудовании, поставках и&nbsp;сервисном обслуживании можно у&nbsp;наших специалистов.</p>

      <div class="hero__actions">
        <a class="btn" href="https://protechnolog.ru/contact/">Связаться с&nbsp;нами</a>
        <ul class="contacts">
          <li><a class="contacts__link" href="tel:+78007757568">8&nbsp;(800)&nbsp;775-75-68</a></li>
          <li><a class="contacts__link" href="mailto:fs@protechnolog.ru">fs@protechnolog.ru</a></li>
        </ul>
      </div>
    </main>
  </div>
</body>
</html>
